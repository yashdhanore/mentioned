name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # The E2E suites under tests/e2e skip without a local Supabase stack, so the backend job
  # above only runs the isolation tests; this job gives them the same stack as `make dev`.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      # Image pulls from the public registry are sometimes rate limited, and a failed start
      # can leave containers holding the ports, so stop fully and back off before retrying.
      - name: Start Supabase
        run: |
          for attempt in 1 2 3; do
            supabase start -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor,mailpit && exit 0
            echo "supabase start failed (attempt $attempt of 3)"
            supabase stop --no-backup || true
            sleep $((attempt * 30))
          done
          exit 1
      - run: scripts/local-db-setup.sh
      - run: uv run pytest tests/e2e -v
        env:
          E2E_REQUIRED: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: outputs/e2e
          retention-days: 14

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
