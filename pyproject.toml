[project]
name = "mentioned-backend"
version = "0.2.0"
description = "Backend for extracting mentioned books, products, and places from Instagram content."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "fastapi[standard]>=0.115.0",
    "google-genai>=1.55.0",
    "httpx>=0.27.0",
    "langfuse>=4.15.6",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.5.0",
    "pyjwt[crypto]>=2.8.0",
    "python-dotenv>=1.0.0",
    # sqlmodel>=0.0.45 maps datetime fields to UTCDateTime: aware UTC in, aware UTC
    # out (including on SQLite). src/timeutils.py produces aware UTC datetimes to match.
    "sqlmodel>=0.0.45",
    "supabase>=2.30.0,<3.0.0",
    # Instagram required browser impersonation (yt-dlp #17074); the fix shipped in the
    # 2026.07.04 stable release (PR #17113), so pin to a stable release again instead of
    # the unpinnable, unhashable moving `master` tarball.
    "yt-dlp[curl-cffi]>=2026.8.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
]

[project.scripts]
mentioned-worker = "src.worker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["data*", "evals*", "migrations*", "tests*"]

[tool.fastapi]
entrypoint = "src.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
# This is a Python backend repo with Markdown docs/plans elsewhere that embed illustrative
# Python snippets; ruff's Markdown code-block formatting is not meant for those, so restrict
# ruff to actual Python source.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF", "PT", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
"tests/test_rls_worker_setup.py" = ["E501"]
# EXTRACTION_PROMPT is literal text sent to Gemini; wrapping it would add a newline to the
# actual prompt.
"src/extraction/gemini.py" = ["E501"]
# conftest disables .env loading before importing the app, which reads settings at import.
"tests/conftest.py" = ["E402"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
