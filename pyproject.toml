[project]
name = "mentioned-backend"
version = "0.1.0"
description = "Backend validation scaffold for extracting readable text from Instagram URLs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "fastapi[standard]>=0.115.0",
    "httpx>=0.27.0",
    "openai>=2.31.0",
    "pillow>=10.0.0",
    "psycopg[binary]>=3.2.0",
    "pyjwt[crypto]>=2.8.0",
    "python-dotenv>=1.0.0",
    "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "respx>=0.21.0",
]

[project.scripts]
mentioned-worker = "worker.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "extractor*", "worker*"]
exclude = ["data*", "evals*", "migrations*", "tests*"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
