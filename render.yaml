services:
  - type: web
    name: mentioned-api
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh scripts/render-start-api.sh
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_MODE
        value: supabase
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: DOCS_ENABLED
        value: "false"
      - key: SOURCE_REQUIRE_HTTPS
        value: "true"
      - key: WORKER_REPLICAS
        value: "1"
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_PROJECT_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        sync: false

  - type: worker
    name: mentioned-worker
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh scripts/render-start-worker.sh
    preDeployCommand: sh scripts/render-predeploy.sh
    numInstances: 1
    maxShutdownDelaySeconds: 300
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_MODE
        value: supabase
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: DOCS_ENABLED
        value: "false"
      - key: SOURCE_REQUIRE_HTTPS
        value: "true"
      - key: WORKER_REPLICAS
        value: "1"
      - key: WORKER_ID
        value: worker-render
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: DATABASE_URL
        sync: false
      - key: WORKER_DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: SUPABASE_PROJECT_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_BOOKS_API_KEY
        sync: false
